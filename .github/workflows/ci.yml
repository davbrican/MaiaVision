name: MaiaVision checks
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API test dependencies
        run: pip install -r apps/backend/requirements.txt
      - name: Validate optional ONVIF dependency
        run: |
          pip install -r apps/edge/requirements-ptz.txt
          python -c 'from onvif import ONVIFCamera; print("ONVIF import OK")'
      - name: Check Python syntax
        run: python -m compileall -q main.py maia_vision apps tests scripts
      - name: Run unit and API tests
        run: python -m unittest discover -s tests -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck and production build
        working-directory: apps/frontend
        run: npm run build
