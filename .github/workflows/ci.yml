name: Python checks

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Pure tests deliberately avoid downloading pretrained weights or opening a camera.
      - name: Check Python syntax
        run: python -m compileall -q main.py maia_vision tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
